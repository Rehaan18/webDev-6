<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Table</title>
</head>
<body>
    <table border = "1"  cellspacing = "0" bgcolor = "lightyellow">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Gender</th>           
        </tr>
        <tr>
            <td bgcolor = "pink">Nandini</td>
            <td>21</td>
            <td>Female</td>
        </tr>
        <tr bgcolor = "lightblue">
            <td>Rehaan</td>
            <td>19</td>
            <td>Male</td>
        </tr>
        <tr>
            <td bgcolor = "lightgreen">Munazzar</td>
            <td>23</td>
            <td>Male</td>
        </tr>
    </table>
</body>
</html>
