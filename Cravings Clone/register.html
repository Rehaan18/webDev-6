<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Cravings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-body">

  <div class="auth-wrapper register-wrapper">

    
    <div class="auth-form-side">
      <div class="auth-form-box">
        <h3 class="fw-bold mb-1">Create Account</h3>
        <p class="text-muted small mb-3">Join thousands already using Cravings</p>

        
        <div class="user-type-selector mb-4">
          <button type="button" class="user-type-btn active" onclick="selectType(this)">Customer</button>
          <button type="button" class="user-type-btn" onclick="selectType(this)">Restaurant</button>
          <button type="button" class="user-type-btn" onclick="selectType(this)">Rider</button>
        </div>

        <form>
          <div class="mb-3">
            <input type="text" class="form-control" placeholder="Full Name" required>
          </div>
          <div class="mb-3">
            <input type="email" class="form-control" placeholder="Email" required>
          </div>
          <div class="mb-3">
            <input type="tel" class="form-control" placeholder="Phone Number">
          </div>
          <div class="mb-3 position-relative">
            <input type="password" class="form-control" placeholder="Password" required style="padding-right:42px;">
            <span class="password-eye">👁</span>
          </div>
          <div class="mb-3 position-relative">
            <input type="password" class="form-control" placeholder="Confirm Password" required style="padding-right:42px;">
            <span class="password-eye">👁</span>
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="agreeTerms" required>
            <label class="form-check-label small" for="agreeTerms">
              I agree to the <a href="terms-of-service.html" style="color:var(--color-primary);font-weight:600;">Terms and Conditions</a>
            </label>
          </div>
          <button type="submit" class="btn btn-main w-100">Create Account</button>
        </form>

        <p class="text-center mt-3 small">
          Already have an account? <a href="login.html" style="color:var(--color-primary);font-weight:600;">Login</a>
        </p>
      </div>
    </div>

    
    <div class="auth-panel auth-panel-right d-none d-md-flex">
      <div class="auth-panel-content">
        <div class="auth-panel-icon">🎉</div>
        <h2>Join Cravings Today!</h2>
        <p>Whether you're a hungry customer, a restaurant owner, or a rider — there's a place for you here.</p>
      </div>
    </div>

  </div>
</body>
</html>
