<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback - Cravings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="feedback-page-body">

  <div class="feedback-card">
    <h2>Share Feedback</h2>
    <p>Help us improve your Cravings experience.</p>

    <form class="mt-4">

      <div class="mb-3">
        <input type="text" class="form-control" placeholder="Full Name" required>
      </div>

      <div class="mb-3">
        <input type="email" class="form-control" placeholder="Email" required>
      </div>

      <div class="mb-3">
        <select class="form-control">
          <option value="" disabled selected>Category</option>
          <option>Food Quality</option>
          <option>Delivery Experience</option>
          <option>App &amp; Website</option>
          <option>Customer Support</option>
          <option>Pricing &amp; Value</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label small text-muted">Your Rating</label>
        <div class="star-rating">
          <span>☆</span><span>☆</span><span>☆</span><span>☆</span><span>☆</span>
        </div>
      </div>

      <div class="mb-3">
        <textarea class="form-control" rows="4" placeholder="Your Feedback" required></textarea>
      </div>

      <button type="submit" class="btn btn-main w-100">Submit Feedback</button>

    </form>
  </div>

</body>
</html>
