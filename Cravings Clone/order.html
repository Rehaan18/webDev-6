
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Now - Cravings</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">

  <style>
    /* ===== PAGE HEADER ===== */
.page-header {
  background: var(--color-base-200);
  text-align: center;
  padding: 70px 20px 60px;
}

.page-header h1 {
  font-weight: 800;
  color: var(--color-base-content);
}

.page-header p {
  color: var(--color-secondary);
  margin-top: 8px;
}

/* ===== SEARCH ===== */
.page-header .search-box input {
  background: white;
  border: 1px solid var(--color-base-300);
}

/* ===== FILTER PILLS ===== */
.filter-bar {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 20px;
}

.pill {
  border-radius: 50px;
  padding: 10px 20px;
  border: 1px solid var(--color-base-300);
  background: var(--color-base-100);
  color: var(--color-base-content);
  cursor: pointer;
  transition: all 0.3s ease;
  font-size: 14px;
}

/* hover */
.pill:hover {
  background: var(--color-base-200);
  transform: translateY(-2px);
}

/* active */
.pill.active {
  background: var(--color-primary);
  color: var(--color-primary-content);
  border: none;
  box-shadow: 0 6px 15px rgba(194,65,12,0.3);
}

/* ===== RESTAURANTS SECTION ===== */
.restaurants {
  background: var(--color-base-100);
}

/* fix badge color */
.badge {
  background: var(--color-base-200);
  color: var(--color-base-content);
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .page-header {
    padding: 50px 15px;
  }

  .page-header h1 {
    font-size: 28px;
  }

  .pill {
    font-size: 13px;
    padding: 8px 16px;
  }
}
.card {
  border: none;
  border-radius: 12px;
  overflow: hidden;
  transition: all 0.3s ease;
}

.card:hover {
  transform: translateY(-6px);
  box-shadow: 0 12px 30px rgba(0,0,0,0.1);
}
.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 8px 8px 0 0;
}
.search-box {
  max-width: 500px;
  margin: auto;
  position: relative;
}

.search-box i {
  position: absolute;
  top: 50%;
  left: 15px;
  transform: translateY(-50%);
  color: gray;
}

.search-box input {
  padding-left: 40px;
  height: 45px;
  border-radius: 30px;
}
  </style>
</head>

<body>

<!-- HEADER -->
<section class="page-header">
  <h1>Order Now</h1>
  <p>Find your favourite restaurant and order in seconds</p>

  <!-- SEARCH -->
  <div class="search-box mt-4">
    <i class="bi bi-search"></i>
    <input type="text" class="form-control" placeholder="Search restaurants or dishes...">
  </div>
</section>

<!-- FILTER PILLS -->
<section class="filter-bar">
  <button class="pill active">🍽️ All</button>
  <button class="pill">🥗 Vegetarian</button>
  <button class="pill">🍖 Non-Veg</button>
  <button class="pill">🍰 Desserts</button>
  <button class="pill">🍱 Others</button>
</section>

<!-- RESTAURANTS -->
<section class="py-5">
  <div class="container">
    <div class="row">

      <!-- CARD 1 -->
      <div class="col-md-4 mb-4">
        <div class="card shadow-sm">
          <img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5">
          <div class="card-body">
            <h5 class="fw-bold">Under The Mango Tree</h5>
            <p class="small text-muted">Grill & BBQ</p>
            <p>⭐ 4.5 · 120 reviews</p>
            <span class="badge">BBQ</span>
            <span class="badge">Grill</span>
            <p class="mt-2 text-muted"><i class="bi bi-geo-alt"></i> Bhopal</p>
            <button class="btn btn-main w-100">Explore Menu</button>
          </div>
        </div>
      </div>

      <!-- CARD 2 -->
      <div class="col-md-4 mb-4">
        <div class="card shadow-sm">
          <img src="https://images.unsplash.com/photo-1552566626-52f8b828add9">
          <div class="card-body">
            <h5 class="fw-bold">Raj Darbar</h5>
            <p class="small text-muted">Indian Cuisine</p>
            <p>⭐ 4.2 · 98 reviews</p>
            <span class="badge">Indian</span>
            <p class="mt-2 text-muted"><i class="bi bi-geo-alt"></i> Bhopal</p>
            <button class="btn btn-main w-100">Explore Menu</button>
          </div>
        </div>
      </div>

      <!-- CARD 3 -->
      <div class="col-md-4 mb-4">
        <div class="card shadow-sm">
          <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836">
          <div class="card-body">
            <h5 class="fw-bold">Countryside Culture</h5>
            <p class="small text-muted">Fine Dining</p>
            <p>⭐ 4.7 · 150 reviews</p>
            <span class="badge">Luxury</span>
            <p class="mt-2 text-muted"><i class="bi bi-geo-alt"></i> Bhopal</p>
            <button class="btn btn-main w-100">Explore Menu</button>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>

<!-- OPTIONAL JS FOR ACTIVE PILL -->
<script>
  const pills = document.querySelectorAll('.pill');

  pills.forEach(pill => {
    pill.addEventListener('click', () => {
      pills.forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
    });
  });
</script>

</body>
</html>
