
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Now - Cravings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<section class="page-header">
  <h1>Order Now</h1>
  <p>Find your favourite restaurant and order in seconds</p>

  
  <div class="search-box mt-4">
    <i class="bi bi-search"></i>
    <input type="text" class="form-control" placeholder="Search restaurants or dishes...">
  </div>
</section>


<section class="filter-bar">
  <button class="pill active">🍽️ All</button>
  <button class="pill">🥗 Vegetarian</button>
  <button class="pill">🍖 Non-Veg</button>
  <button class="pill">🍰 Desserts</button>
  <button class="pill">🍱 Others</button>
</section>


<section class="py-5">
  <div class="container">
    <div class="row">

      
      <div class="col-md-4 mb-4">
        <div class="card shadow-sm">
          <img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5">
          <div class="card-body">
            <h5 class="fw-bold">Under The Mango Tree</h5>
            <p class="small text-muted">Grill & BBQ</p>
            <p>⭐ 4.5 · 120 reviews</p>
            <span class="badge">BBQ</span>
            <span class="badge">Grill</span>
            <p class="mt-2 text-muted"><i class="bi bi-geo-alt"></i> Bhopal</p>
            <button class="btn btn-main w-100">Explore Menu</button>
          </div>
        </div>
      </div>

      
      <div class="col-md-4 mb-4">
        <div class="card shadow-sm">
          <img src="https://images.unsplash.com/photo-1552566626-52f8b828add9">
          <div class="card-body">
            <h5 class="fw-bold">Raj Darbar</h5>
            <p class="small text-muted">Indian Cuisine</p>
            <p>⭐ 4.2 · 98 reviews</p>
            <span class="badge">Indian</span>
            <p class="mt-2 text-muted"><i class="bi bi-geo-alt"></i> Bhopal</p>
            <button class="btn btn-main w-100">Explore Menu</button>
          </div>
        </div>
      </div>

      
      <div class="col-md-4 mb-4">
        <div class="card shadow-sm">
          <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836">
          <div class="card-body">
            <h5 class="fw-bold">Countryside Culture</h5>
            <p class="small text-muted">Fine Dining</p>
            <p>⭐ 4.7 · 150 reviews</p>
            <span class="badge">Luxury</span>
            <p class="mt-2 text-muted"><i class="bi bi-geo-alt"></i> Bhopal</p>
            <button class="btn btn-main w-100">Explore Menu</button>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>



</body>
</html>
