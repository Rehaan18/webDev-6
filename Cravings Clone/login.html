<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Cravings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-body">

  <div class="auth-wrapper">

    <!-- LEFT DECORATIVE PANEL -->
    <div class="auth-panel auth-panel-left d-none d-md-flex">
      <div class="auth-panel-content">
        <div class="auth-panel-icon">🍜</div>
        <h2>Welcome Back!</h2>
        <p>Your favourite food is just a few clicks away. Log in and satisfy those cravings.</p>
      </div>
    </div>

    
    <div class="auth-form-side">
      <div class="auth-form-box">
        <h3 class="fw-bold mb-1">Login</h3>
        <p class="text-muted small mb-4">Enter your credentials to continue</p>

        <form>
          <div class="mb-3">
            <input type="email" class="form-control" placeholder="Email Address" required>
          </div>

          <div class="mb-3 position-relative">
            <input type="password" class="form-control" placeholder="Password" required style="padding-right:42px;">
            <span class="password-eye">👁</span>
          </div>

          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe">
            <label class="form-check-label small" for="rememberMe">Remember me</label>
          </div>

          <button type="submit" class="btn btn-main w-100">Login</button>
        </form>

        <p class="text-center mt-3 small">
          Don't have an account? <a href="register.html" style="color:var(--color-primary);font-weight:600;">Register</a>
        </p>
      </div>
    </div>

  </div>

</body>
</html>
