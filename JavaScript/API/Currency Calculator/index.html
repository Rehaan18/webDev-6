<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-light">
    <div
      class="container d-flex justify-content-center align-items-center vh-100"
    >
      <div class="card shadow p-4" style="width: 400px">
        <h2 class="text-center mb-4 text-info">Currency Converter</h2>

        <div class="mb-3 p-2">
          <label class="form-label">Amount</label>
          <input
            type="number"
            id="amount"
            class="form-control"
            placeholder="Enter amount"
          />
        </div>

        <div class="mb-3 p-2">
          <label class="form-label">From</label>
          <select id="fromCurrency" class="form-select p-2">
            <option value="USD">USD</option>
            <option value="INR">INR</option>
            <option value="EUR">EUR</option>
            <option value="GBP">GBP</option>
            <option value="JPY">JPY</option>
          </select>
        </div>

        <div class="mb-3 p-2">
          <label class="form-label">To</label>
          <select id="toCurrency" class="form-select p-2">
            <option value="INR">INR</option>
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="GBP">GBP</option>
            <option value="JPY">JPY</option>
          </select>
        </div>

        <button class="btn btn-outline-info w-100" onclick="convertCurrency()">
          Convert
        </button>

        <div class="mt-4 text-center text-warning">
          <h4 id="result">Converted Money:</h4>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
